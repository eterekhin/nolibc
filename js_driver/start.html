<!doctype html>
<html>
<body>
<script type="module">
    class ExitError extends Error {
        constructor(status) {
            super(`WebAssembly exited with status code ${status}`);
            this.status = status;
        }
    }

    const defaultArgv = ["start.html", "42", "Hello, World!"];
    const defaultEnvv = [{MY_ENV_VAR_NAME: "MY_ENV_VAR_VALUE"}, {PATH: "hello/world"}];
    const printParameterHelp = () =>
        console.warn('Use ?argv=["program","arg"]&env={"NAME":"VALUE"}&reportExitCode=true.');

    const parseStringArrayParameter = (name) => {
        const value = new URLSearchParams(window.location.search).get(name);
        if (value === null)
            return null;

        try {
            const parsed = JSON.parse(value);
            if (Array.isArray(parsed) && parsed.every(item => typeof item === "string"))
                return parsed;
        } catch {
        }
        printParameterHelp();
        return null;
    };

    const parseEnvironmentParameter = () => {
        const value = new URLSearchParams(window.location.search).get("env");
        if (value === null)
            return null;

        try {
            const parsed = JSON.parse(value);
            if (parsed !== null && !Array.isArray(parsed) && typeof parsed === "object" &&
                Object.entries(parsed).every(([name, value]) => name.length > 0 && typeof value === "string"))
                return Object.entries(parsed).map(([name, value]) => ({[name]: value}));
        } catch {
        }
        printParameterHelp();
        return null;
    };

    let argv = parseStringArrayParameter("argv") ?? defaultArgv;
    let envv = parseEnvironmentParameter() ?? defaultEnvv;
    const reportExitCode = new URLSearchParams(window.location.search).get("reportExitCode") === "true";

    let memory;
    let write_buffer = [];
    let heap_end;

    const copy_strs_to_mem_fn = (strs, dst, isEnv) => {
        const mem = new Uint8Array(memory.buffer);

        let cursor = dst;
        const encoder = new TextEncoder();

        for (const arg of strs) {
            let value;
            if (isEnv) {
                const keys = Object.keys(arg);
                const envName = keys[0];
                const envValue = arg[envName];
                value = envName + "=" + envValue;
            } else
                value = arg

            // todo: currently only ansi strings are supported
            const bytes = encoder.encode(value);
            mem.set(bytes, cursor);
            cursor += bytes.length;
            mem[cursor++] = 0;
        }
    }

    const imports = {
        env: {
            put_args(dst, argSizePtr) {
                let result = 0;
                for (const arg of argv)
                    result += arg.length + 1 /*NULL*/;

                if (dst !== 0)
                    copy_strs_to_mem_fn(argv, dst, false);

                if (argSizePtr !== 0) {
                    const view = new DataView(memory.buffer);
                    view.setInt32(argSizePtr, argv.length, true);
                }
                return result;
            },
            put_env(dst, envSizePtr) {
                let result = 0;

                for (const arg of envv) {
                    const keys = Object.keys(arg);
                    const envName = keys[0];
                    const envValue = arg[envName];
                    result += envName.length + 1 /* = */ + envValue.length + 1/* NULL */
                }

                if (dst !== 0)
                    copy_strs_to_mem_fn(envv, dst, true);
                if (envSizePtr !== 0) {
                    const view = new DataView(memory.buffer);
                    view.setInt32(envSizePtr, envv.length, true);
                }
                return result
            },
            wasm_mmap(addr, size, prot) {
                // TODO: validate prot
                if (addr !== 0 || size === 0)
                    return -22;

                const page_size = 64 * 1024 // 64 KB, default wasm code page size
                // align by 8 bytes, there is no obvious need to do that, but some C code calling us may expect to have
                // the returned address aligned
                const aligned_start = (heap_end + 7) & ~7;
                const end = aligned_start + size;
                if (memory.buffer.byteLength <= end) {
                    const add_pages = Math.ceil((end - memory.buffer.byteLength) / page_size);
                    // TODO: check success?
                    memory.grow(add_pages)
                }

                heap_end = end;
                return aligned_start;
            },
            wasm_write(fd, buf, size) {
                const bytes = new Uint8Array(memory.buffer, buf, size);
                for (let i = 0; i < bytes.length; i++) {
                    const current = bytes[i];
                    if (current === 10) { // When \n met do console.log
                        console.log(new TextDecoder().decode(new Uint8Array(write_buffer).buffer));
                        write_buffer = [];
                    } else
                        write_buffer.push(bytes[i]);
                }
                return size;
            },
            wasm_exit(status) {
                throw new ExitError(status);
            }
        }
    };

    const bytes = await fetch("../hello_wasm").then(r => r.arrayBuffer());
    const {instance} = await WebAssembly.instantiate(bytes, imports);
    memory = instance.exports.memory
    heap_end = instance.exports.wasm_heap_base()
    try {
        instance.exports.wasm_start();
    } catch (error) {
        if (!(error instanceof ExitError))
            throw error;
        if (reportExitCode)
            console.log(error.message);
    }
</script>
</body>
</html>
